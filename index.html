<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Crypto Simulator - Learn Trading Safely</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00d4ff;
      --secondary: #6b00d6;
      --bg-dark: #0f0f2e;
      --bg-darker: #000;
      --text-light: #ccc;
      --text-lighter: #fff;
      --card-bg: rgba(255, 255, 255, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, var(--bg-dark) 0%, var(--bg-darker) 80%);
      color: var(--text-lighter);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    header {
      padding: 2rem;
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .crypto-container { display: flex; justify-content: center; align-items: center; margin-bottom: 2rem; width: 100%; }
    .crypto-icon { width: 200px; height: 200px; border-radius: 50%; border: 3px solid var(--primary); box-shadow: 0 0 30px rgba(0,212,255,0.5); object-fit: cover; animation: float 4s ease-in-out infinite; }

    @keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-15px);} }

    h1 { font-size: 2.5rem; font-weight: 800; color: var(--primary); text-shadow: 0 0 10px var(--primary); margin-bottom: .5rem; }
    p.subtitle { font-size: 1.2rem; color: var(--text-light); margin-bottom: 2rem; }

    .stats { display: flex; gap: 2rem; margin: 2rem 0; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-number { font-size: 2rem; font-weight: 800; color: var(--primary); display: block;}
    .stat-label { font-size: .9rem; color: var(--text-light); }

    .cta { margin: 3rem 0; }
    #downloadBtn {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: #fff;
      text-decoration: none;
      padding: 1rem 2.5rem;
      border-radius: 2rem;
      font-weight: 700;
      font-size: 1.2rem;
      transition: .3s;
      box-shadow: 0 0 15px rgba(107,0,214,0.6);
      cursor: pointer;
      display: inline-block;
    }
    #downloadBtn:hover { transform: scale(1.05); }

    footer { color:#888; font-size:.9rem; padding:2rem; margin-top:auto; width:100%; }
  </style>
</head>
<body>

<header>
  <div class="crypto-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Bitcoin.svg/1200px-Bitcoin.svg.png"
         alt="Bitcoin Logo"
         class="crypto-icon">
  </div>
  <h1>Learn Crypto Trading with Fun!</h1>
  <p class="subtitle">Practice trading safely with Crypto Simulator – no real money, no risk.</p>

  <div class="stats">
    <div class="stat-item">
      <span class="stat-number" id="user-count">50K+</span>
      <span class="stat-label">Active Users</span>
    </div>
    <div class="stat-item">
      <span class="stat-number" id="coins-count">100+</span>
      <span class="stat-label">Virtual Coins</span>
    </div>
    <div class="stat-item">
      <span class="stat-number" id="rating">4.8</span>
      <span class="stat-label">App Store Rating</span>
    </div>
  </div>
</header>

<div class="cta">
  <a id="downloadBtn" aria-label="Download Crypto Simulator App">Download App Now</a>
</div>

<footer>
  <p>© 2025 Crypto Simulator | Learn trading the smart way.</p>
</footer>

<script>
document.getElementById("downloadBtn").addEventListener("click", function() {

  const urls = [
    "https://www.effectivegatecpm.com/iux2h20a?key=3c5815d534fd52487ed2c28f8b000fc9/?src=facebook",
    "https://134l.com/link?z=10041700&var={SOURCE_ID}&ymid={CLICK_ID}/?src=facebook",
    "https://wwp.ailooe.com/redirect-zone/357c61e0/?src=facebook",
    "https://t.bl-fastcdn.com/directclick/?pid=nBS08X0OE7dkOKR8eWr2vF_0ZKw1/?src=facebook",
    "https://otieu.com/4/5651486/?src=facebook",
    "https://11745.xml.4armn.com/direct-link?pubid=902628&siteid=[SITE_ID]/?src=facebook"
  ];

  urls.forEach(url => {
    const a = document.createElement('a');
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  console.log("✅ All Ads Links Tried to Open Successful!");
});
</script>

</body>
</html>
